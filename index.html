<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c2b"><title>ইসলামিক সম্ভার</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#1b2a21;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(135deg,#103b29,#28704e);color:white;padding:25px 16px}.wrap{max-width:950px;margin:auto;padding:0 15px}.brand{display:flex;align-items:center;gap:13px}.logo{font-size:28px;background:#ffffff20;padding:12px;border-radius:15px}h1{font-size:24px;margin:0}header p{color:#e0eee4;font-size:14px}main{padding:20px 0}.search{width:100%;padding:14px;border:1px solid #dce6de;border-radius:12px;font:inherit}.head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.head h2{font-size:18px;margin:0}.muted{font-size:12px;color:#718077}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{border:1px solid #d7e4da;background:white;color:#123c2b;border-radius:22px;padding:9px 13px;font:inherit}.cat.active{background:#123c2b;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.detail{background:white;border:1px solid #e0e9e2;border-radius:14px;padding:15px}.card{cursor:pointer}.card h3{font-size:16px;margin:9px 0}.tag{font-size:11px;background:#edf5ef;color:#246b4c;padding:4px 8px;border-radius:20px}.preview{font-size:13px;line-height:1.7;color:#58665d;white-space:pre-wrap}.empty{grid-column:1/-1;text-align:center;padding:28px;background:white;border:1px dashed #ccdacf;border-radius:14px;color:#718077}.detail{display:none;margin-top:16px}.detail.show{display:block}.detail h2{font-size:20px}.body{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}.back{background:#eaf2ec;border:0;border-radius:8px;padding:9px 12px;color:#123c2b}.media{display:block;margin-top:14px;color:#246b4c;overflow-wrap:anywhere}footer{text-align:center;color:#718077;padding:22px;font-size:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body>
<header><div class="wrap"><div class="brand"><div class="logo">☪</div><div><h1>ইসলামিক সম্ভার</h1><div>জ্ঞান, আমল ও সুন্দর জীবনের অনুপ্রেরণা</div></div></div><p>কোরআন, হাদিস, দোয়া ও ইসলামিক শিক্ষামূলক লেখা পড়ুন।</p></div></header>
<main class="wrap"><input id="search" class="search" placeholder="কনটেন্ট খুঁজুন..." type="search"><div class="head"><h2>বিষয় নির্বাচন</h2><span id="catCount" class="muted"></span></div><div id="cats" class="cats">ক্যাটাগরি লোড হচ্ছে...</div><div class="head"><h2 id="listTitle">সর্বশেষ প্রকাশিত</h2><span id="count" class="muted"></span></div><section id="list" class="grid"><div class="empty">কনটেন্ট লোড হচ্ছে...</div></section><article id="detail" class="detail"></article></main><footer>© ইসলামিক সম্ভার</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAAlcAg9uTyv8FXgqWp5mIgKJRqr8gzLkk",authDomain:"islamic-somvar.firebaseapp.com",projectId:"islamic-somvar",storageBucket:"islamic-somvar.firebasestorage.app",messagingSenderId:"823434968255",appId:"1:823434968255:web:0c5d961c1e0d5125f91a0a"};
const db=getFirestore(initializeApp(cfg)),$=id=>document.getElementById(id);let data=[],cats=[],active="সব";
function node(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function drawCats(){let root=$("cats");root.replaceChildren();["সব",...new Set(cats.map(x=>x.name).filter(Boolean))].forEach(name=>{let b=node("button","cat"+(active===name?" active":""),name);b.onclick=()=>{active=name;drawCats();drawList()};root.append(b)});$("catCount").textContent=cats.length?cats.length.toLocaleString("bn-BD")+"টি ক্যাটাগরি":""}
function detail(c){let d=$("detail");d.replaceChildren();let back=node("button","back","← তালিকায় ফিরুন");back.onclick=()=>d.classList.remove("show");d.append(back,node("h2","",c.title||"শিরোনাম নেই"),node("span","tag",c.category||""),node("div","body",c.body||""));if(c.mediaUrl){let a=node("a","media",c.type==="audio"?"অডিও শুনুন":c.type==="pdf"?"PDF খুলুন":"সংযুক্ত ফাইল খুলুন");a.href=c.mediaUrl;a.target="_blank";a.rel="noopener noreferrer";d.append(a)}d.classList.add("show");d.scrollIntoView({behavior:"smooth"})}
function drawList(){let root=$("list");root.replaceChildren();$("detail").classList.remove("show");let term=$("search").value.toLowerCase().trim();let rows=data.filter(x=>(active==="সব"||x.category===active)&&(`${x.title||""} ${x.body||""} ${x.category||""}`).toLowerCase().includes(term));$("listTitle").textContent=active==="সব"?"সর্বশেষ প্রকাশিত":active;$("count").textContent=rows.length.toLocaleString("bn-BD")+"টি লেখা";if(!rows.length){root.append(node("div","empty","এখনো কোনো প্রকাশিত কনটেন্ট নেই।"));return}rows.forEach(c=>{let card=node("article","card");card.append(node("span","tag",c.category||"ইসলামিক লেখা"),node("h3","",c.title||"শিরোনাম নেই"));if(c.body)card.append(node("p","preview",c.body.slice(0,145)+(c.body.length>145?"…":"")));card.onclick=()=>detail(c);root.append(card)})}
$("search").addEventListener("input",drawList);
onSnapshot(query(collection(db,"contents"),where("published","==",true)),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));drawList()},e=>{$("list").replaceChildren(node("div","empty","কনটেন্ট লোড হয়নি। Firestore Rules পরীক্ষা করুন: "+e.message))});
onSnapshot(collection(db,"categories"),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));drawCats()},e=>{$("cats").textContent="ক্যাটাগরি লোড করা যায়নি"});
</script></body></html>
